</head><body>

    <header class="site-header"><h2>DENNIS & SONS FURNITURE STORE</h2>

<nav>

</header><section class="page-banner"><h1>Customer Registration</h1>

<p>Register with Denis and Sons Furniture today.</p>

</section><section class="section register-section"><form class="form-card register-card"
      onsubmit="event.preventDefault();
      alert('Registration completed successfully!');">

    <h2>Customer Details</h2>

    <label>First Name</label>

    <input type="text"
           placeholder="First name" required>

    <label>Last Name</label>

    <input type="text"
           placeholder="Last name" required>

    <label>Email Address</label>

    <input type="email"
           placeholder="Email address" required>

    <label>Contact Number</label>

    <input type="tel"
           placeholder="Contact number" required>

    <label>Address</label>

    <input type="text"
           placeholder="Your location">

    <label>Product Interested In</label>

    <select required>

        <option value="">Select Product</option>

        <option>Sofas</option>

        <option>Beds</option>

        <option>Dining Tables</option>

        <option>Office Furniture</option>

        <option>Wardrobes</option>

    </select>

    <label class="check">

        <input type="checkbox" required>
        I agree to the terms and conditions.
    </label>

    <button type="submit" class="button">
        Register 
    </button>

</form>

</section><footer>
    <p>© 2026 Dennis and Sons Furniture store. All Rights Reserved.</p>
</footer></body>
</html>
